<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Draft Lottery Live</title><style>
:root{--bg:#24113f;--panel:#111827;--text:#f8fafc;--muted:#94a3b8;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,rgba(168,85,247,.22),transparent 35%),var(--bg);color:var(--text);min-height:100vh}
.wrap{width:min(1180px,94vw);margin:auto;padding:28px 0 48px}h1{font-size:clamp(28px,4vw,48px);margin:0;letter-spacing:-.04em}.sub{color:var(--muted);line-height:1.5}
.card{background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:18px}
.status{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;color:#cbd5e1}
.track{position:relative;padding:14px 18px 20px}.lane{height:94px;position:relative;border-bottom:1px dashed rgba(255,255,255,.14);background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 40px,transparent 40px,transparent 80px)}
.label{position:absolute;top:7px;left:6px;background:rgba(8,17,31,.85);border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900}
.horse{position:absolute;left:0;bottom:9px;font-size:43px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35));transform:scaleX(-1)}
.finish{position:absolute;right:58px;top:14px;bottom:20px;width:10px;background:linear-gradient(45deg,#fff 25%,#111 25%,#111 50%,#fff 50%,#fff 75%,#111 75%);background-size:10px 10px}
.results{display:none}.results.show{display:block}.section{font-size:13px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#cbd5e1;margin:12px 0 10px}
.result{display:grid;grid-template-columns:45px 1fr auto;gap:10px;padding:11px 16px;border-top:1px solid var(--line);align-items:center}.place{font-size:22px;font-weight:1000}.muted{color:var(--muted);font-size:12px}
.waiting{text-align:center;padding:36px 20px;color:#cbd5e1;font-size:20px;font-weight:800}
@media(max-width:850px){.track{padding-left:8px;padding-right:8px}.finish{right:42px}.lane{height:74px}.horse{font-size:35px}}
</style></head>
<body><div class="wrap"><h1>Fantasy Draft Lottery</h1><p class="sub">Live race feed. The first horse across receives the #1 overall pick.</p>
<div class="card"><div class="status" id="status">Waiting for commissioner to start the race…</div><div class="track" id="track"><div class="finish"></div><div class="waiting" id="waiting">🏇 Waiting for the live race…</div></div>
<div class="results" id="results"><div class="section" style="padding:0 16px">Official Draft Order</div><div id="resultsList"></div></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
const firebaseConfig={"apiKey":"AIzaSyCpIuzyeln-BaTEsYPHIuL5MWm7ba8omN0","authDomain":"no-name-fantasy-odds-simulator.firebaseapp.com","databaseURL":"https://no-name-fantasy-odds-simulator-default-rtdb.firebaseio.com","projectId":"no-name-fantasy-odds-simulator","storageBucket":"no-name-fantasy-odds-simulator.firebasestorage.app","messagingSenderId":"25144021690","appId":"1:25144021690:web:44b39676565c009ddc6883"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
let animationToken=0;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setupTrack(horses){
 const t=document.getElementById("track"); t.querySelectorAll(".lane").forEach(x=>x.remove());
 horses.forEach(h=>{const lane=document.createElement("div");lane.className="lane";lane.innerHTML=`<div class="label">${esc(h.name)}</div><div class="horse" id="horse${h.id}">🏇</div>`;t.insertBefore(lane,t.querySelector(".finish"))});
}
function showResults(horses,payload){
  const ranked=[...horses].sort((a,b)=>a.place-b.place);
  const lotteryRows=ranked.map((h,i)=>`<div class="result"><div class="place">${i+1}</div><div><strong>${esc(h.name)}</strong><div class="muted">${h.odds.toFixed(2)}% starting chance at #1</div></div><strong>Pick #${i+1}</strong></div>`);
  const lockedRows=[];
  for(let pick=5;pick<=12;pick++){
    const name=(payload.locked && payload.locked[pick]) ? payload.locked[pick] : `Pick #${pick}`;
    lockedRows.push(`<div class="result"><div class="place">${pick}</div><div><strong>${esc(name)}</strong><div class="muted">Locked by standings</div></div><strong>Pick #${pick}</strong></div>`);
  }
  document.getElementById("resultsList").innerHTML=[...lotteryRows,...lockedRows].join("");
  document.getElementById("results").classList.add("show");
}
function runAnimation(payload){
 const token=++animationToken;
 const horses=payload.horses.map(h=>({...h})); const order=payload.order; const targets=[18.6,19.25,19.9,20.55];
 horses.forEach(h=>{h.place=order.indexOf(h.id);h.target=targets[h.place];const x=Math.sin((payload.seed+h.id*91.17)*12.9898)*43758.5453;const y=Math.sin((payload.seed+h.id*47.31)*78.233)*12345.6789;h.phase=(x-Math.floor(x))*Math.PI*2;h.phase2=(y-Math.floor(y))*Math.PI*2;h.finished=false;h.progress=0;});
 setupTrack(horses);document.getElementById("results").classList.remove("show");document.getElementById("status").textContent="They're off!";
 const localStart=performance.now();
 function tick(now){if(token!==animationToken)return;const elapsed=(now-localStart)/1000;let count=0;
   horses.forEach((h,idx)=>{if(h.finished){count++;return}const base=(elapsed/h.target)*100;const early=Math.max(0,1-Math.pow(elapsed/h.target,2.3));const stretch=elapsed>h.target-5?Math.max(0,(h.target-elapsed)/5):1;const drama=(Math.sin(elapsed*(1.05+idx*.07)+h.phase)*5.2+Math.sin(elapsed*2.15+h.phase2)*2)*early*stretch;h.progress=Math.max(h.progress,Math.min(99.4,base+drama));if(elapsed>=h.target){h.progress=100;h.finished=true;count++}document.getElementById(`horse${h.id}`).style.left=`calc(${h.progress}% - ${h.progress*.62}px)`;});
   if(count===horses.length){document.getElementById("status").textContent="All horses have crossed. Race complete.";showResults(horses,payload);return}requestAnimationFrame(tick);
 }
 requestAnimationFrame(tick);
}
let lastRace=null;

function renderCompletedRace(payload){
  animationToken++;
  const horses=(payload.horses||[]).map(h=>({...h,place:(payload.order||[]).indexOf(h.id)}));
  setupTrack(horses);
  horses.forEach(h=>{
    const el=document.getElementById(`horse${h.id}`);
    if(el)el.style.left="calc(100% - 62px)";
  });
  document.getElementById("waiting").style.display="none";
  document.getElementById("status").textContent="Race complete. Official draft order:";
  showResults(horses,payload);
}

onValue(ref(db,"race"),snap=>{
  const payload=snap.val();

  if(!payload || payload.status==="waiting"){
    animationToken++;
    document.getElementById("status").textContent="Waiting for commissioner to start the race…";
    document.getElementById("waiting").style.display="block";
    document.getElementById("results").classList.remove("show");
    lastRace=null;
    return;
  }

  if(payload.status==="complete"){
    lastRace=payload.createdAt||null;
    renderCompletedRace(payload);
    return;
  }

  if(payload.status==="running"){
    if(lastRace===payload.createdAt)return;
    lastRace=payload.createdAt;
    document.getElementById("waiting").style.display="none";
    runAnimation(payload);
  }
});
</script></body></html>
